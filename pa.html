<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performing Arts</title>
  <link rel="stylesheet" href="CSS.css">
</head>

<body class="fade-in">

  <nav class="topnav">
    <a class="active" href="pa.html">Performing Arts</a>
    <a href="va.html">Visual Arts</a>
    <a href="ss.html">Social Studies</a>
    <a href="index.html">Home</a>
  </nav>

  <main class="page">
    <h1>Performing Arts</h1>
    <p class="desc">Add description</p>

    <div class="now-playing" id="nowPlaying">
      <div class="now-playing-label">Now Playing</div>
      <div class="now-playing-title" id="nowPlayingTitle">-</div>
      <div class="now-playing-members" id="nowPlayingMembers">-</div>
    </div>

    <div class="songs">
      <div class="song" data-src="https://drive.google.com/uc?export=download&id=YOUR_FILE_ID" data-comment="add comment">
        <img class="song-thumb" src="https://placehold.co/100x100/2d5a4a/fff?text=1" alt="Song 1">
        <div class="song-details">
          <span class="song-title">1x</span>
          <span class="song-members">Anton, Son, Belly, Ellie, Nate, Lucas</span>
        </div>
      </div>

      <div class="song" data-src="https://drive.google.com/uc?export=download&id=YOUR_FILE_ID" data-comment="add comment">
        <img class="song-thumb" src="https://placehold.co/100x100/2d5a4a/fff?text=2" alt="Song 2">
        <div class="song-details">
          <span class="song-title">2x</span>
          <span class="song-members">Ava, Ino, Julian, Rocio</span>
        </div>
      </div>

      <div class="song" data-src="https://drive.google.com/uc?export=download&id=YOUR_FILE_ID" data-comment="add comment">
        <img class="song-thumb" src="https://placehold.co/100x100/2d5a4a/fff?text=3" alt="Song 3">
        <div class="song-details">
          <span class="song-title">3x</span>
          <span class="song-members">Aly, Aoki, Gaeun, Pax</span>
        </div>
      </div>
    </div>

    <div class="player" id="player">
      <button id="playBtn" aria-label="Play/Pause">&#9658;</button>
      <div class="progress">
        <div id="progressFill"></div>
      </div>
      <span id="time">0:00 / 0:00</span>
    </div>

    <div class="song-info-panel" id="songInfoPanel">
      <div class="song-info-header">
        <span class="song-info-title" id="songInfoTitle">-</span>
        <button class="song-info-close" id="songInfoClose" aria-label="Close">&times;</button>
      </div>
      <div class="song-info-artist" id="songInfoArtist">-</div>
      <div class="song-info-comment" id="songInfoComment">-</div>
      <div class="song-info-tags">
        <span class="song-info-tag" id="songInfoTag">peace</span>
      </div>
    </div>

  </main>

  <script src="Javascript.js"></script>
</body>
</html>
